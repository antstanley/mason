name: ci

# Gate every PR and every push to main on the same checks the repo enforces
# locally: tests, lint, format, the guards, and wasm compilability. No secrets,
# so this runs on fork PRs where the preview deploy cannot.
on:
  pull_request:
  push:
    branches: [main]

# one run per ref; a new push supersedes an in-flight run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (wasm32), wasm-pack and the cargo cache
        uses: ./.github/actions/rust
        with:
          components: clippy, rustfmt
          tools: just,nextest

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        run: cd web && pnpm install --frozen-lockfile

      - name: Assert Cargo.lock is fresh
        run: cd server && cargo metadata --locked --format-version 1 > /dev/null

      # the web app imports the generated wasm pkg (gitignored), so build it
      # before the web checks; this also compiles mortar-core to wasm32, so it
      # doubles as the wasm compilability gate. tsc and knip need the pkg present.
      - name: Build wasm (generates web/src/lib/mortar-wasm/pkg)
        run: just wasm

      # ONE step, the same recipe a developer runs before pushing. Naming the
      # gates individually here meant this list and `check` could disagree, and
      # they did: guard-toolchain joined `check` and never reached CI, so a pull
      # request whose pinned channel contradicted its declared MSRV went green.
      # Calling the recipe means a gate added to `check` is enforced here for
      # free, and the claim that CI runs the same set is true by construction.
      - name: Gate (guards, fmt-check, lint, test)
        run: just check

  # the browser build's Rust paths (gloo transport, timer seam, wasm throttle)
  # executed for real: wasm-bindgen tests in headless chrome, which the ubuntu
  # runner image ships with a matching chromedriver
  wasm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (wasm32), wasm-pack and the cargo cache
        uses: ./.github/actions/rust
        with:
          tools: just

      - name: Test (wasm-bindgen-test, headless chrome)
        run: just test-wasm

  # the service-worker smoke: build the real static site, then drive it in
  # chromium so /api/feed round-trips through the wasm engine end to end
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (wasm32), wasm-pack and the cargo cache
        uses: ./.github/actions/rust
        with:
          tools: just

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        run: cd web && pnpm install --frozen-lockfile

      - name: Install chromium
        run: cd web && pnpm exec playwright install --with-deps chromium

      - name: Build the static site (wasm + vite)
        run: just build

      - name: Service-worker smoke (playwright)
        run: cd web && pnpm test:e2e
